name: DeepEVI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-smoke:
    name: Python smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile production Python
        run: python -m compileall -q bin

      - name: Run repository smoke test
        run: pytest -q tests/test_repository_layout.py

  nextflow-smoke:
    name: Nextflow configuration smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "25.10.2"

      - name: Validate Nextflow configuration
        run: nextflow config nextflow.config

      - name: Preview core preprocessing entrypoint
        run: |
          mkdir -p tests/fixtures/primary_raw
          nextflow run main.nf \
            --primary_raw_dir tests/fixtures/primary_raw \
            --outdir results_ci \
            -preview
